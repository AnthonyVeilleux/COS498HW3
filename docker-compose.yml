services:
  # Node.js Express application
  backend-nodejs:
    build: ./backend
    container_name: backend-nodejs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=80
    # No ports exposed - only nginx can access this container
    networks:
      - app-network

  # nginx reverse proxy
  nginx:
    build: 
      context: .
      dockerfile: ./nginx/dockerfile
    container_name: my-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"  # Map external port 80 to internal port 80
    depends_on:
      - backend-nodejs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
